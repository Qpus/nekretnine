name: proveri-oglase

on:
  schedule:
    # na 15 min, od 06:00 do 23:59 po srpskom vremenu (UTC 04-21)
    - cron: "*/15 4-21 * * *"
  workflow_dispatch:

permissions:
  contents: write   # da bi bot mogao da sačuva state/seen.json

concurrency:
  group: stan-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pokreni bota
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Sačuvaj viđene oglase
        run: |
          git config user.name "stan-bot"
          git config user.email "stan-bot@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || (git commit -m "azuriran spisak vidjenih oglasa" && git push)
